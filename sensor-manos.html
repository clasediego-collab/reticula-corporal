<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensor de manos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #070a0d; color: #dfe9ef;
    font-family: ui-monospace, "IBM Plex Mono", Menlo, monospace;
    font-size: 13px; line-height: 1.5;
    display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
             max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    gap: 12px;
  }
  h1 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; margin: 0; color: #36d6e0; }
  #status { color: #7d929f; font-size: 12px; min-height: 1.4em; }
  #status.ok  { color: #36d6e0; }
  #status.err { color: #ffc24a; }
  #preview { flex: 1; min-height: 0; background: #000; border-radius: 6px; position: relative; overflow: hidden; }
  #preview video, #preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #preview video { transform: scaleX(-1); }
  #stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #7d929f; }
  #stats b { color: #36d6e0; font-variant-numeric: tabular-nums; }
  button {
    font-family: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    padding: 13px 22px; background: #36d6e0; color: #04161a; border: 0;
    border-radius: 2px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: progress; }
</style>
</head>
<body>
<h1>Sensor de manos</h1>
<div id="status">Listo para activar.</div>
<div id="preview">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<div id="stats">
  <span>WS <b id="s-ws">—</b></span>
  <span>cámara <b id="s-cam">—</b></span>
  <span>manos <b id="s-hands">0</b></span>
  <span>fps <b id="s-fps">—</b></span>
</div>
<button id="start">Activar sensor</button>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const status = $('status'), startBtn = $('start');

let ws = null, handLM = null, lastTime = -1, reconnectTimer = 0;
let sendTimer = 0, fpsN = 0, fpsT = performance.now();
let lastHands = [];

const HAND_BONES = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

function setStatus(t, cls = '') { status.textContent = t; status.className = cls; }

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/?role=sensor`;
}

function connectWS() {
  clearTimeout(reconnectTimer);
  try { ws && ws.close(); } catch {}
  $('s-ws').textContent = 'conectando';
  ws = new WebSocket(wsUrl());
  ws.onopen  = () => { $('s-ws').textContent = 'conectado'; };
  ws.onclose = () => {
    $('s-ws').textContent = 'reconectando';
    reconnectTimer = setTimeout(connectWS, 1500);
  };
  ws.onerror = () => { $('s-ws').textContent = 'error'; };
}

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = 'Iniciando…';
  setStatus('Solicitando cámara…');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    $('s-cam').textContent = `${video.videoWidth}×${video.videoHeight}`;
  } catch (e) {
    setStatus('Cámara bloqueada (' + (e.name || 'Error') + '). Sirve por HTTPS.', 'err');
    startBtn.disabled = false;
    startBtn.textContent = 'Reintentar';
    return;
  }

  setStatus('Cargando modelo de manos…');
  const modelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    try {
      handLM = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'GPU' },
        runningMode: 'VIDEO', numHands: 2,
        minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5
      });
    } catch {
      handLM = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
        runningMode: 'VIDEO', numHands: 2,
        minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5
      });
    }
  } catch (e) {
    setStatus('Error cargando modelo: ' + (e.message || e), 'err');
    startBtn.disabled = false;
    startBtn.textContent = 'Reintentar';
    return;
  }

  setStatus('Sensor activo. Muestra las manos a la cámara.', 'ok');
  startBtn.textContent = 'Reiniciar';
  startBtn.disabled = false;
  startBtn.onclick = () => location.reload();

  connectWS();
  resizeOverlay();
  requestAnimationFrame(loop);

  // Mantener pantalla encendida si el navegador lo permite
  try {
    if ('wakeLock' in navigator) {
      const lock = () => navigator.wakeLock.request('screen').catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') lock();
      });
      lock();
    }
  } catch {}
}

function resizeOverlay() {
  const r = overlay.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  overlay.width  = Math.max(2, Math.round(r.width  * dpr));
  overlay.height = Math.max(2, Math.round(r.height * dpr));
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function loop() {
  requestAnimationFrame(loop);
  if (!handLM || video.readyState < 2) return;

  const now = performance.now();
  if (video.currentTime === lastTime) return;
  lastTime = video.currentTime;

  try {
    const res = handLM.detectForVideo(video, now);
    lastHands = res.landmarks || [];
  } catch { lastHands = []; }

  // Enviar por WS a 30 Hz máximo
  if (now - sendTimer > 33 && ws && ws.readyState === 1) {
    sendTimer = now;
    const payload = lastHands.map(h => h.map(lm => ({
      x: +lm.x.toFixed(4),
      y: +lm.y.toFixed(4)
    })));
    try { ws.send(JSON.stringify({ hands: payload })); } catch {}
  }

  // FPS
  fpsN++;
  if (now - fpsT > 500) {
    $('s-fps').textContent = Math.round(fpsN * 1000 / (now - fpsT));
    fpsN = 0; fpsT = now;
  }
  $('s-hands').textContent = lastHands.length;

  drawOverlay(lastHands);
}

function drawOverlay(hands) {
  const r = overlay.getBoundingClientRect();
  const W = r.width, H = r.height;
  octx.clearRect(0, 0, W, H);
  if (!hands.length) return;

  const vw = video.videoWidth || 16, vh = video.videoHeight || 9;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;

  octx.lineWidth = 2;
  octx.strokeStyle = '#36d6e0';
  octx.fillStyle = '#ff4fb0';

  for (const hand of hands) {
    // Video está CSS-mirrored; reflejamos las coords del overlay para alinear.
    const pts = hand.map(lm => ({
      x: dx + (1 - lm.x) * dw,
      y: dy + lm.y * dh
    }));

    octx.beginPath();
    for (const [a, b] of HAND_BONES) {
      octx.moveTo(pts[a].x, pts[a].y);
      octx.lineTo(pts[b].x, pts[b].y);
    }
    octx.stroke();

    for (const p of pts) {
      octx.beginPath();
      octx.arc(p.x, p.y, 3, 0, 6.2832);
      octx.fill();
    }
  }
}

startBtn.onclick = start;
addEventListener('resize', resizeOverlay);
</script>
</body>
</html>
